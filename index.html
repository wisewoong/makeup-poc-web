<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>화장 도우미 PoC</title>
<style>
:root{--acc:#e0567a;--ok:#1f9d6b;--warn:#e08a1e;--bad:#d93a3a;--ink:#16181c;--mut:#6b7078;--bg:#fff}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink)}
#stage{position:fixed;inset:0;overflow:hidden;background:#000}
#video,#overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#panel{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-radius:18px 18px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.25);max-height:58vh;overflow:auto}
#top{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0))}
#top b{font-size:15px}
.chip{font-size:12px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.18);white-space:nowrap}
h2{margin:0 0 4px;font-size:18px}
p{margin:4px 0 10px;color:#33363c}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{appearance:none;border:0;border-radius:12px;min-height:46px;padding:0 16px;font:600 15px/1 inherit;background:#eceef1;color:var(--ink);flex:1 1 auto}
button.pri{background:var(--acc);color:#fff}
button.go{background:var(--ok);color:#fff}
button:disabled{opacity:.4}
button:focus-visible{outline:3px solid #1d6fe0;outline-offset:2px}
select{font-size:16px;min-height:40px;border-radius:10px;border:1px solid #ccd;padding:0 8px;background:#fff}
.meters{display:grid;grid-template-columns:5.5em 1fr 3.2em;gap:6px 8px;align-items:center;font-size:13px;margin:8px 0 4px}
.bar{height:10px;background:#e7e9ec;border-radius:99px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:99px;transition:width .2s}
.bar s{position:absolute;top:-3px;bottom:-3px;width:2px;background:#222;opacity:.55}
.num{text-align:right;font-variant-numeric:tabular-nums}
.msg{padding:10px 12px;border-radius:12px;margin:8px 0;font-weight:600}
.msg.ok{background:#e3f6ee;color:#0f6a46}.msg.bad{background:#fde8e8;color:#9b1f1f}.msg.warn{background:#fff3e0;color:#8a4b00}.msg.info{background:#eef2f7;color:#2b3b52}
.small{font-size:12px;color:var(--mut)}
.steps{display:flex;gap:6px;margin-bottom:8px}
.steps span{flex:1;height:5px;border-radius:9px;background:#e3e5e8}
.steps span.on{background:var(--acc)}.steps span.done{background:var(--ok)}
label.t{display:flex;align-items:center;gap:6px;font-size:13px;color:#33363c}
textarea{width:100%;height:120px;font:12px/1.4 ui-monospace,Menlo,monospace;border-radius:10px;border:1px solid #ccd;padding:8px}
#start{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding:28px;background:#fff;z-index:5}
#start h1{font-size:26px;margin:0 0 8px}
#start ol{padding-left:1.2em;color:#33363c}
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
</div>
<div id="top"><b>화장 도우미 PoC · 블러셔</b><span class="chip" id="fps">–</span></div>

<div id="start">
  <h1>화장 도우미 PoC</h1>
  <p>블러셔 1단계를 AR로 안내하고, 덜 바르면 다음으로 넘어가지 않는지 검증합니다.</p>
  <ol>
    <li>휴대폰을 세워 두고 팔 길이 정도 거리에서 정면을 봐 주세요.</li>
    <li>밝은 곳(창가·정면 조명)에서 블러셔 바르기 <b>전</b> 상태로 시작합니다.</li>
    <li>블러셔가 없으면 틴트·립을 볼에 톡톡 발라도 됩니다.</li>
  </ol>
  <p class="small">카메라 영상은 이 기기 안에서만 처리되고 어디에도 전송되지 않습니다.</p>
  <div class="row">
    <label class="t">판정 강도
      <select id="strength"><option value="loose">느슨</option><option value="normal" selected>보통</option><option value="strict">엄격</option></select>
    </label>
    <label class="t" hidden>블러셔 색(룩)
      <select id="look"><option value="coral">코랄</option><option value="pink" selected>핑크</option><option value="rose">로즈</option><option value="peach">피치</option></select>
    </label>
    <label class="t"><input type="checkbox" id="tts" checked> 음성 안내</label>
  </div>
  <div class="row"><button class="pri" id="btnStart">카메라 시작</button></div>
  <p class="small" id="loadMsg">v18 · 11-22</p>
</div>

<div id="panel" hidden>
  <div class="steps"><span id="s0"></span><span id="s1"></span><span id="s2"></span><span id="s3"></span></div>
  <div id="view"></div>
  <div class="row" style="margin-top:6px">
    <label class="t"><input type="checkbox" id="showPts"> 판정 지점 보기</label>
    <label class="t"><input type="checkbox" id="showMap" checked> 변화 지도 보기</label>
    <label class="t"><input type="checkbox" id="fillZone"> 영역 색 채우기</label>
  </div>
</div>

<script type="module">
import {FaceLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs";

// ---------- 설정 ----------
const CHEEK_A=[36,50,101,116,117,118,119,123,147,187,205,206,207];      // 화면(원본) 기준 한쪽 볼
const CHEEK_B=[266,280,330,345,346,347,348,352,376,411,425,426,427];   // 반대쪽 볼 (대칭 쌍)
const FOREHEAD=[10,151,9,109,338,108,337,67,297];                        // 조명 변화 보정용 기준 영역
const TEMPLES=[127,356], NOSE=1, FACE_L=234, FACE_R=454;
const TH={ // 판정 강도별 기준값 (관리자 설정값을 흉내 냄)
  loose: {cov:2.5, lDrop:2.5, colTol:40, covMin:.55, symTol:.35, outMax:.30, intMax:18},
  normal:{cov:3.5, lDrop:3.0, colTol:30, covMin:.70, symTol:.25, outMax:.20, intMax:15},
  strict:{cov:5.0, lDrop:4.0, colTol:20, covMin:.80, symTol:.15, outMax:.12, intMax:12},
};
// 룩 블러셔 색 (관리자 룩 프로파일의 blush.color를 흉내 냄)
const LOOKS={coral:{name:'코랄',hex:'#F4A08C',mood:'생기 있고 건강한 느낌'},pink:{name:'핑크',hex:'#F2A7B8',mood:'러블리하고 화사한 느낌'},rose:{name:'로즈',hex:'#D98A96',mood:'차분하고 우아한 느낌'},peach:{name:'피치',hex:'#F7B59B',mood:'맑고 자연스러운 느낌'}};
let LOOK_ORDER=['pink','coral','rose','peach']; // 다른 룩 추천 순서 — 미리보기 시작 때 피부 톤 측정으로 다시 정함
// 피부 톤 → 추천 순서 (참고용 간이 판정. 정식 퍼스널컬러 F1-2는 화이트밸런스 보정 포함 별도 개발)
const TONE_ORDER={
  warm_light:['peach','coral','pink','rose'], warm_deep:['coral','peach','rose','pink'],
  cool_light:['pink','rose','peach','coral'], cool_deep:['rose','pink','coral','peach'],
  neutral_light:['peach','pink','coral','rose'], neutral_deep:['rose','coral','peach','pink'],
};
const TONE_TH={warmH:60, coolH:52, lightL:62}; // 피부 색상각 h=atan2(b*,a*)°: 클수록 노란 기(웜). 실기기 로그로 조정
let tone=null, toneBuf=[], toneT=0;
let pvAlpha=.28, pvOrig=false, pvStart=0;
function lab2rgb(L,a,b){
  let y=(L+16)/116,x=a/500+y,z=y-b/200; const f=t=>t**3>.008856?t**3:(t-16/116)/7.787;
  x=f(x)*.95047;y=f(y);z=f(z)*1.08883;
  let R=x*3.2406+y*-1.5372+z*-.4986, G=x*-.9689+y*1.8758+z*.0415, B=x*.0557+y*-.2040+z*1.0570;
  const g=c=>255*Math.min(1,Math.max(0,c>.0031308?1.055*c**(1/2.4)-.055:12.92*c)); return [g(R),g(G),g(B)];
}
// 피부색에 룩 색을 조금씩 섞을 때 a*b* 변화 방향 (변화량 mag에 해당하는 만큼 섞은 지점 기준 — 섞을수록 방향이 휘기 때문)
function mixDir(skin,tgtHex,mag){
  const s=lab2rgb(...skin), t=[1,3,5].map(i=>parseInt(tgtHex.slice(i,i+2),16)); let last=[1,0];
  for(let al=.02;al<=1;al+=.02){const m=rgb2lab(...s.map((v,k)=>v*(1-al)+t[k]*al)); const da=m[1]-skin[1],db=m[2]-skin[2],n=Math.hypot(da,db); if(n>1e-6) last=[da/n,db/n]; if(n>=mag) break;}
  return last;
}
const INNER_T=[.3,.55,.8,.95], OUTER_T=1.6;
const OUT_REL=.85;  // 영역 이탈: 바깥 지점이 안쪽 평균 진하기의 85% 이상일 때만 이탈로 봄 (경계 블렌딩 허용, v16 실측 .7은 자연스러운 번짐도 이탈)
const SIDE_GLARE=10; // 한쪽 볼 밝기가 (이마 보정 후) 영역 전체에서 이만큼 바뀌면 빛 반사·측면 조명으로 보고 판정 보류 (v16 실측 오른쪽 +15)
const YAW_TOL=.08;  // 판정 보류: 기준 저장 때보다 고개가 이만큼 더 돌아가면 (v7: .1 차이에 볼 일부 왜곡, v8: .06은 보류 15회로 과다)

// ---------- 상태 ----------
const $=id=>document.getElementById(id);
const video=$('video'), cv=$('overlay'), ctx=cv.getContext('2d');
const off=document.createElement('canvas'), octx=off.getContext('2d',{willReadFrequently:true});
let landmarker, lm=null, step=0, baseline=null, live=null, fails=0, stepStart=0, lastEval=null, raf=0;
const log={ua:navigator.userAgent, startedAt:new Date().toISOString(), strength:null, attempts:[]};
let frames=0, fpsT=performance.now();

// ---------- 유틸 ----------
const say=t=>{ if(!$('tts').checked||!('speechSynthesis' in window)) return; try{speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='ko-KR'; u.rate=1.05; speechSynthesis.speak(u);}catch(e){} };
function rgb2lab(r,g,b){
  const f=c=>{c/=255;return c<=.04045?c/12.92:((c+.055)/1.055)**2.4};
  const R=f(r),G=f(g),B=f(b);
  let x=(R*.4124+G*.3576+B*.1805)/.95047, y=(R*.2126+G*.7152+B*.0722), z=(R*.0193+G*.1192+B*.9505)/1.08883;
  const h=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;
  x=h(x);y=h(y);z=h(z);
  return [116*y-16, 500*(x-y), 200*(y-z)];
}
const P=i=>({x:lm[i].x*cv.width, y:lm[i].y*cv.height});
const centroid=pts=>({x:pts.reduce((s,p)=>s+p.x,0)/pts.length, y:pts.reduce((s,p)=>s+p.y,0)/pts.length});
function hull(pts){ // 볼록 껍질 (monotone chain)
  const a=[...pts].sort((p,q)=>p.x-q.x||p.y-q.y); if(a.length<3) return a;
  const cr=(o,p,q)=>(p.x-o.x)*(q.y-o.y)-(p.y-o.y)*(q.x-o.x);
  const lo=[],up=[];
  for(const p of a){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}
  for(const p of a.slice().reverse()){while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}
  return lo.slice(0,-1).concat(up.slice(0,-1));
}
// 영역 다듬기: 0°=귀 쪽, 90°=아래쪽. 이 방향 둘레를 최대 amt만큼 줄임 (실기기: 광대 위쪽에 바르면 아래·바깥 끝이 안 닿음)
const ZONE_TRIM={dir:60, amt:.35};
const trimAt=th=>1-ZONE_TRIM.amt*Math.max(0,Math.cos(th-ZONE_TRIM.dir*Math.PI/180));
const LIGHT_HOLD={L:12, ab:6}; // 이마 밝기·색이 기준 저장 때보다 이만큼 바뀌면 판정 보류 (가림·조명 변화)
const N_DIR=12; // 판정 방향 수 (고정): 볼 중심에서 12방향 × INNER_T 4지점 + 바깥 12지점
// 중심 c에서 방향 d로 쏜 반직선이 볼록 껍질 h와 만나는 거리
function rayHit(h,c,d){
  let best=Infinity;
  for(let i=0;i<h.length;i++){const p=h[i],q=h[(i+1)%h.length],ex=q.x-p.x,ey=q.y-p.y,den=d.x*ey-d.y*ex; if(Math.abs(den)<1e-9) continue;
    const s=((p.x-c.x)*ey-(p.y-c.y)*ex)/den, u=((p.x-c.x)*d.y-(p.y-c.y)*d.x)/den; if(s>0&&u>=-1e-6&&u<=1+1e-6&&s<best) best=s;}
  return best;
}
// 판정 지점을 프레임마다 같은 위치·같은 개수로 만든다 (예전: 껍질 꼭짓점 수가 프레임마다 달라 기준과 현재가 엇갈림)
function zone(idx,ux,uy,nose){
  const pts=idx.map(P), h=hull(pts), c=centroid(pts);
  const sign=((c.x-nose.x)*ux.x+(c.y-nose.y)*ux.y)<0?-1:1; // 0번 방향 = 얼굴 바깥쪽 (좌우 볼이 대칭 번호)
  const meanR=h.reduce((s,v)=>s+Math.hypot(v.x-c.x,v.y-c.y),0)/h.length;
  const inner=[c], outer=[], edge=[];
  for(let k=0;k<N_DIR;k++){
    const th=k/N_DIR*Math.PI*2, d={x:Math.cos(th)*sign*ux.x+Math.sin(th)*uy.x, y:Math.cos(th)*sign*ux.y+Math.sin(th)*uy.y};
    let r0=rayHit(h,c,d); if(!isFinite(r0)) r0=meanR; const r=r0*trimAt(th); // 판정·표시 영역은 다듬은 r
    edge.push({x:c.x+d.x*r, y:c.y+d.y*r});
    for(const t of INNER_T) inner.push({x:c.x+d.x*r*t, y:c.y+d.y*r*t});
    outer.push({x:c.x+d.x*r0*OUTER_T, y:c.y+d.y*r0*OUTER_T}); // 이탈 판정은 원래 영역 기준 (다듬은 쪽 블렌딩 경계 허용 — v14 실측 이탈 오판정)
  }
  return {h,c,inner,outer,edge};
}
function zones(){
  const fl=P(FACE_L), fr=P(FACE_R), len=Math.hypot(fr.x-fl.x,fr.y-fl.y)||1;
  const ux={x:(fr.x-fl.x)/len,y:(fr.y-fl.y)/len}, uy={x:-ux.y,y:ux.x}; // 얼굴 가로축·세로축 (고개 기울기 반영)
  if(uy.y<0){uy.x=-uy.x;uy.y=-uy.y}
  const nose=P(NOSE);
  const A=zone(CHEEK_A,ux,uy,nose), B=zone(CHEEK_B,ux,uy,nose);
  // 화면(거울)에서 사용자의 '오른쪽 볼'은 원본 영상의 왼쪽(x 작음)
  const [right,left]=A.c.x<B.c.x?[A,B]:[B,A];
  right.name='오른쪽 볼'; left.name='왼쪽 볼';
  for(const z of [left,right]){ const t=TEMPLES.map(P).find(p=>(p.x<nose.x)===(z.c.x<nose.x))||P(TEMPLES[0]); z.temple=t; }
  return {left,right,fh:FOREHEAD.map(P)};
}
function sampleLab(img,p,r){
  let L=0,a=0,b=0,n=0; const W=img.width,H=img.height,d=img.data, px=p.x-img.ox, py=p.y-img.oy; // img는 얼굴 부분만 잘라낸 영역
  const x0=Math.max(0,Math.round(px-r)),x1=Math.min(W-1,Math.round(px+r)),y0=Math.max(0,Math.round(py-r)),y1=Math.min(H-1,Math.round(py+r));
  for(let y=y0;y<=y1;y+=2)for(let x=x0;x<=x1;x+=2){const k=(y*W+x)*4;const q=rgb2lab(d[k],d[k+1],d[k+2]);L+=q[0];a+=q[1];b+=q[2];n++}
  return n?[L/n,a/n,b/n]:[0,0,0];
}
function measure(full){ // full: 얼굴 전체 랜드마크 468곳 색도 측정 (변화 지도용, 기준 저장·판정 때만)
  if(!lm) return null;
  // 얼굴 둘레만 잘라 읽기 (전체 화면을 읽으면 iOS에서 프레임이 크게 끊김)
  let x0=1,y0=1,x1=0,y1=0; for(const q of lm){if(q.x<x0)x0=q.x;if(q.x>x1)x1=q.x;if(q.y<y0)y0=q.y;if(q.y>y1)y1=q.y}
  const mx=(x1-x0)*.35, my=(y1-y0)*.15;
  const sx=Math.max(0,Math.floor((x0-mx)*cv.width)), sy=Math.max(0,Math.floor((y0-my)*cv.height));
  const sw=Math.max(1,Math.min(cv.width,Math.ceil((x1+mx)*cv.width))-sx), sh=Math.max(1,Math.min(cv.height,Math.ceil((y1+my)*cv.height))-sy);
  if(off.width<sw||off.height<sh){off.width=Math.max(off.width,sw);off.height=Math.max(off.height,sh)} // 크기를 매번 바꾸지 않음
  octx.drawImage(video,sx,sy,sw,sh,0,0,sw,sh);
  const img=octx.getImageData(0,0,sw,sh); img.ox=sx; img.oy=sy;
  const z=zones(), fw=Math.abs(P(FACE_R).x-P(FACE_L).x), r=Math.max(2,fw*.012);
  const m=pts=>pts.map(p=>sampleLab(img,p,r));
  const fh=m(z.fh); const fhA=fh.reduce((s,q)=>s+q[1],0)/fh.length, fhL=fh.reduce((s,q)=>s+q[0],0)/fh.length, fhB=fh.reduce((s,q)=>s+q[2],0)/fh.length;
  const nose=P(NOSE), yaw=(nose.x-(P(FACE_L).x+P(FACE_R).x)/2)/(fw/2); // 0=정면, ±=좌우로 돌림
  return {fw, fwRatio:fw/cv.width, fhA, fhL, fhB, yaw,
    left:{inner:m(z.left.inner), outer:m(z.left.outer)}, right:{inner:m(z.right.inner), outer:m(z.right.outer)},
    all: full ? lm.slice(0,468).map((_,i)=>sampleLab(img,P(i),r)) : null};
}
function averageMeasures(list){
  const avg=arrs=>arrs[0].map((_,i)=>[0,1,2].map(k=>arrs.reduce((s,a)=>s+a[i][k],0)/arrs.length));
  const mean=k=>list.reduce((s,m)=>s+m[k],0)/list.length;
  return {fhA:mean('fhA'), fhL:mean('fhL'), fhB:mean('fhB'), yaw:mean('yaw'), fwRatio:mean('fwRatio'),
    left:{inner:avg(list.map(m=>m.left.inner)),outer:avg(list.map(m=>m.left.outer))},
    right:{inner:avg(list.map(m=>m.right.inner)),outer:avg(list.map(m=>m.right.outer))},
    all: list.every(m=>m.all)?avg(list.map(m=>m.all)):null};
}
function evaluate(cur){
  const th=TH[$('strength').value], light=cur.fhA-baseline.fhA, lightL=cur.fhL-baseline.fhL, lightB=(cur.fhB||0)-(baseline.fhB||0);
  const look=LOOKS[$('look').value];
  const side=s=>{
    const bi=baseline[s].inner, ci=cur[s].inner;
    // 기대 색 방향: 이 볼의 원래 피부색 → 룩 색 (a*b* 평면)
    const skin=[0,1,2].map(k=>bi.reduce((t,q)=>t+q[k],0)/bi.length);
    let [ea,eb]=mixDir(skin,look.hex,8); // 덮임 판정용 방향 (보통 정도 발랐을 때)
    const da=ci.map((q,i)=>(q[1]-bi[i][1])-light), db=ci.map((q,i)=>(q[2]-bi[i][2])-lightB);
    // d = 룩 색 쪽으로 바뀐 양 (예전: 붉은 기 a*만 봄 → 색이 달라도 통과)
    const d=da.map((v,i)=>v*ea+db[i]*eb);
    const od=cur[s].outer.map((q,i)=>((q[1]-baseline[s].outer[i][1])-light)*ea+((q[2]-baseline[s].outer[i][2])-lightB)*eb);
    const dl=ci.map((q,i)=>(q[0]-bi[i][0])-lightL); // 지점별 밝기 변화 (조명 보정)
    // 발림: 룩 색 쪽 변화가 기준 이상이거나, 조금 바뀌면서 밝기가 확실히 떨어짐 (밝은 조명에서 색이 바래 보일 때)
    const covered=d.map((v,i)=>v>=th.cov||(v>=th.cov*.4&&dl[i]<=-th.lDrop));
    const cov=covered.filter(Boolean).length/d.length;
    const covVals=d.filter((v,i)=>covered[i]);
    const inten=covVals.length?covVals.reduce((a,b)=>a+b,0)/covVals.length:0;
    const outTh=Math.max(th.cov*1.3, inten*OUT_REL);
    const out=od.filter(v=>v>=outTh).length/od.length;
    const avgD=d.reduce((a,b)=>a+b,0)/d.length;
    const dL=dl.reduce((a,b)=>a+b,0)/dl.length;
    // 색 일치: 발린 지점들의 실제 색 변화 방향 vs 기대 방향 (각도, +면 더 노랗게/주황, -면 더 푸르게/핑크)
    let sa=0,sb=0,n=0; covered.forEach((c,i)=>{if(c){sa+=da[i];sb+=db[i];n++}});
    let colDiff=null; const mag=n?Math.hypot(sa/n,sb/n):0;
    // 어느 정도 발린 뒤에만 색 판단
    if(cov>=th.covMin*.7&&mag>=th.cov){ const [xa,xb]=mixDir(skin,look.hex,mag); let x=Math.atan2(sb,sa)-Math.atan2(xb,xa); x=Math.atan2(Math.sin(x),Math.cos(x)); colDiff=x*180/Math.PI; }
    const sdl=[...dl].sort((a,b)=>a-b), medDl=sdl[sdl.length>>1];
    return {cov,inten,out,covered,avgD,dL,d,od,dl,colDiff,medDl,shift:n?[sa/n,sb/n]:[0,0]};
  };
  const L=side('left'), R=side('right');
  const symCov=Math.abs(L.cov-R.cov), symInt=Math.min(L.inten,R.inten)/Math.max(L.inten,R.inten,1e-6);
  const issues=[];
  for(const [n,s] of [['왼쪽 볼',L],['오른쪽 볼',R]]){
    if(s.cov<th.covMin) issues.push({k:'cov',side:n,t:`${n}에 덜 발린 부분이 있어요 (${Math.round(s.cov*100)}%)`});
    if(s.out>th.outMax) issues.push({k:'out',side:n,t:`${n} 블러셔가 영역 밖으로 나갔어요. 경계를 블렌딩하세요`});
    if(s.inten>th.intMax) issues.push({k:'int',side:n,t:`${n}이 너무 진해요. 깨끗한 퍼프로 두드려 덜어내세요`});
    if(s.colDiff!=null&&Math.abs(s.colDiff)>th.colTol) issues.push({k:'col',side:n,t:`${n} 색이 ${look.name} 룩보다 ${s.colDiff>0?'주황빛(노란 기)':'핑크빛(푸른 기)'}이 강해요. ${look.name} 색에 가까운 제품으로 덧발라 주세요`});
  }
  if(L.cov>=th.covMin*.8&&R.cov>=th.covMin*.8&&(symCov>th.symTol||symInt<.6)){
    const weak=(L.cov+L.inten/20)<(R.cov+R.inten/20)?'왼쪽 볼':'오른쪽 볼';
    issues.push({k:'sym',side:weak,t:`좌우가 달라요. ${weak}을 조금 더 발라주세요`});
  }
  return {L,R,symCov,symInt,issues,pass:issues.length===0,light,lightL,lightB,look:look.name,yawDiff:(cur.yaw||0)-(baseline.yaw||0)};
}

// ---------- 피부 톤 측정 ----------
function toneSample(){ // 볼 안쪽(가장자리 제외) + 이마 피부색
  const m=measure(); if(!m) return null;
  const pick=arr=>arr.filter((_,i)=>i===0||(i-1)%4<2);
  const pts=[...pick(m.left.inner),...pick(m.right.inner)];
  const med=k=>{const v=pts.map(q=>q[k]).sort((a,b)=>a-b);return v[v.length>>1]};
  return {L:med(0),a:med(1),b:med(2),fhL:m.fhL,fhA:m.fhA,fhB:m.fhB,yaw:m.yaw};
}
function finishTone(){
  const avg=k=>toneBuf.reduce((s,q)=>s+q[k],0)/toneBuf.length;
  const L=avg('L'), a=(avg('a')+avg('fhA'))/2, b=(avg('b')+avg('fhB'))/2, h=Math.atan2(b,a)*180/Math.PI;
  const temp=h>=TONE_TH.warmH?'warm':h<=TONE_TH.coolH?'cool':'neutral', depth=L>=TONE_TH.lightL?'light':'deep';
  const sd=Math.sqrt(toneBuf.reduce((s,q)=>s+(Math.atan2(q.b,q.a)*180/Math.PI-h)**2,0)/toneBuf.length);
  const fhL=avg('fhL'), lightOk=fhL>=45&&fhL<=85, margin=Math.min(Math.abs(h-TONE_TH.warmH),Math.abs(h-TONE_TH.coolH));
  const conf=!lightOk||sd>4?'낮음':(temp==='neutral'||margin<3)?'보통':'높음';
  LOOK_ORDER=TONE_ORDER[temp+'_'+depth];
  tone={temp,depth,L:+L.toFixed(1),a:+a.toFixed(1),b:+b.toFixed(1),h:+h.toFixed(1),sd:+sd.toFixed(1),fhL:Math.round(fhL),conf,order:LOOK_ORDER.join(',')};
  log.tone=tone; $('look').value=LOOK_ORDER[0]; log.preview={seen:[LOOK_ORDER[0]]}; pvStart=performance.now();
  const T=toneText(); say(`${T.label}으로 보여요. ${LOOKS[LOOK_ORDER[0]].name} 블러셔를 먼저 추천해 드릴게요.`); render();
}
function toneText(){
  const tl={warm:'웜',cool:'쿨',neutral:'뉴트럴'}[tone.temp], dl=tone.depth==='light'?'밝은 톤':'깊은 톤';
  const why={warm:'피부에 노란 기가 도는 편이라',cool:'피부에 붉은·푸른 기가 도는 편이라',neutral:'노란 기와 붉은 기가 고르게 섞여 있어'}[tone.temp];
  return {label:`${tl} · ${dl}`, why:`${why} ${LOOK_ORDER.slice(0,2).map(k=>LOOKS[k].name).join('·')} 순으로 먼저 추천했어요`};
}
function retone(){tone=null;toneBuf=[];toneT=0;delete log.tone;render()}

// ---------- 변화 지도: 얼굴 전체 랜드마크에서 룩 색 쪽 변화량 ----------
let lastMap=null;
function changeMap(cur,e){
  if(!cur.all||!baseline.all) return null;
  const bi=[...baseline.left.inner,...baseline.right.inner], skin=[0,1,2].map(k=>bi.reduce((t,q)=>t+q[k],0)/bi.length);
  const [ea,eb]=mixDir(skin,LOOKS[$('look').value].hex,8);
  lastMap=cur.all.map((q,i)=>((q[1]-baseline.all[i][1])-e.light)*ea+((q[2]-baseline.all[i][2])-(e.lightB||0))*eb);
  // 로그: 변화가 큰 랜드마크 번호:값 (상위 30)
  return lastMap.map((v,i)=>[i,v]).filter(([,v])=>v>=3).sort((a,b)=>b[1]-a[1]).slice(0,30).map(([i,v])=>i+':'+Math.round(v)).join(',');
}

// ---------- 그리기 ----------
// 화면 떨림 줄이기: 윤곽 점을 이전 프레임과 섞음
const ema={}; function steady(key,pts,k=.65){const o=ema[key];if(!o||o.length!==pts.length){ema[key]=pts.map(p=>({...p}));return ema[key]}for(let i=0;i<pts.length;i++){o[i].x+=(pts[i].x-o[i].x)*k;o[i].y+=(pts[i].y-o[i].y)*k}return o}
// 볼 영역 윤곽을 같은 크기·기울기의 타원으로 (경계를 촘촘히 샘플링해 공분산으로 맞춤)
function ellipseOf(h){
  const pts=[]; for(let i=0;i<h.length;i++){const p=h[i],q=h[(i+1)%h.length];for(let k=0;k<8;k++)pts.push({x:p.x+(q.x-p.x)*k/8,y:p.y+(q.y-p.y)*k/8})}
  const c=centroid(pts); let xx=0,yy=0,xy=0; for(const p of pts){const dx=p.x-c.x,dy=p.y-c.y;xx+=dx*dx;yy+=dy*dy;xy+=dx*dy}
  xx/=pts.length;yy/=pts.length;xy/=pts.length;
  const tr=(xx+yy)/2, det=Math.sqrt(((xx-yy)/2)**2+xy*xy), l1=tr+det, l2=Math.max(tr-det,1e-6);
  return {x:c.x,y:c.y,a:Math.sqrt(2*l1),b:Math.sqrt(2*l2),rot:.5*Math.atan2(2*xy,xx-yy)};
}
function softZone(s,alpha,warn){
  const raw=ellipseOf(s.edge), [e]=steady(s.name,[raw]); e.rot=raw.rot; e.a+=(raw.a-e.a)*.65; e.b+=(raw.b-e.b)*.65;
  if($('fillZone').checked){ // 선택: 영역 색 채우기 (실제 발린 색이 가려짐)
    const col=warn?'217,58,58':'236,96,130';
    ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(e.rot); ctx.scale(1,e.b/e.a);
    const g=ctx.createRadialGradient(0,0,0,0,0,e.a);
    g.addColorStop(0,`rgba(${col},${Math.min(.75,alpha*1.7)})`); g.addColorStop(.6,`rgba(${col},${alpha})`); g.addColorStop(1,`rgba(${col},0)`);
    ctx.beginPath(); ctx.arc(0,0,e.a,0,Math.PI*2); ctx.fillStyle=g; ctx.fill(); ctx.restore();
  }
  // 기본: 윤곽선만 (그림자로 어떤 피부색에서도 보이게)
  ctx.save(); ctx.beginPath(); ctx.ellipse(e.x,e.y,e.a,e.b,e.rot,0,Math.PI*2);
  ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=4; ctx.setLineDash(warn?[]:[10,7]);
  ctx.strokeStyle=warn?'rgba(255,80,80,.95)':'rgba(255,255,255,.9)'; ctx.lineWidth=warn?3.5:2.2; ctx.stroke(); ctx.restore();
}
function draw(t){
  ctx.clearRect(0,0,cv.width,cv.height);
  if(!lm){return}
  const z=zones();
  if(step===-1){ // 완성 모습 미리보기: 룩 색 블러셔를 가상으로 입힘
    if(pvOrig||!tone) return;
    const col=LOOKS[$('look').value].hex, rgb=[1,3,5].map(i=>parseInt(col.slice(i,i+2),16)).join(',');
    for(const s of [z.left,z.right]){ const e=ellipseOf(s.edge);
      ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(e.rot); ctx.scale(1,e.b/e.a);
      const g=ctx.createRadialGradient(0,0,0,0,0,e.a*1.15);
      g.addColorStop(0,`rgba(${rgb},${pvAlpha})`); g.addColorStop(.55,`rgba(${rgb},${pvAlpha*.7})`); g.addColorStop(1,`rgba(${rgb},0)`);
      ctx.beginPath(); ctx.arc(0,0,e.a*1.15,0,Math.PI*2); ctx.fillStyle=g; ctx.fill(); ctx.restore(); }
    return;
  }
  if(step===0){ // 얼굴 위치 안내용 윤곽
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;
    for(const s of [z.left,z.right]){const e=ellipseOf(s.edge);ctx.beginPath();ctx.ellipse(e.x,e.y,e.a,e.b,e.rot,0,Math.PI*2);ctx.stroke()}
    return;
  }
  if(step===1){
    const pulse=.22+.12*Math.sin(t/300);
    const bad=new Set((lastEval&&!lastEval.pass)?lastEval.issues.map(i=>i.side):[]);
    for(const s of [z.left,z.right]){
      const blink=bad.has(s.name)&&Math.floor(t/350)%2===0;
      softZone(s,blink?.4:pulse*1.2,bad.has(s.name)&&Math.floor(t/350)%2===0);
      // 바르는 방향: 볼 중심 → 관자놀이 쪽
      const k=((t/1200)%1), a={x:s.c.x+(s.temple.x-s.c.x)*.15,y:s.c.y+(s.temple.y-s.c.y)*.15}, b={x:s.c.x+(s.temple.x-s.c.x)*(.35+.3*k),y:s.c.y+(s.temple.y-s.c.y)*(.35+.3*k)};
      ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      const ang=Math.atan2(b.y-a.y,b.x-a.x);ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-14*Math.cos(ang-.5),b.y-14*Math.sin(ang-.5));ctx.lineTo(b.x-14*Math.cos(ang+.5),b.y-14*Math.sin(ang+.5));ctx.closePath();ctx.fill();
    }
    if($('showMap').checked&&lastMap){ // 변화 지도: 노랑(약)→빨강(강)
      lastMap.forEach((v,i)=>{ if(v<2) return; const p=P(i);
        ctx.fillStyle=v>=7?'rgba(230,30,30,.95)':v>=4?'rgba(255,140,0,.9)':'rgba(255,225,0,.85)';
        ctx.beginPath(); ctx.arc(p.x,p.y,v>=4?4.5:3.5,0,7); ctx.fill(); }); }
    if($('showPts').checked&&live){
      for(const [s,res] of [[z.left,live.L],[z.right,live.R]]){
        s.inner.forEach((p,i)=>{ctx.fillStyle=res.covered[i]?'#3ddc84':'rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill()});
        s.outer.forEach(p=>{ctx.strokeStyle='#ffd54a';ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.stroke()});
      }
    }
  }
}

      <div class="row">
        <button class="go" id="btnJudge">다 발랐어요</button>
        <button id="btnSkip" hidden>그래도 넘어가기</button>
      </div>
      <div class="row"><button id="btnRebase">기준 다시 저장</button></div>`;
    $('btnJudge').onclick=judge; $('btnSkip').onclick=()=>finish('SKIPPED'); $('btnNext').onclick=()=>finish('DONE');
    $('btnRebase').onclick=()=>{
      if(!confirm('기준은 블러셔를 바르기 전 얼굴로 저장해야 해요.\n이미 발랐다면 지운 뒤에 다시 저장해 주세요.\n\n지금 다시 저장할까요?')) return;
      (log.events=log.events||[]).push({rebase:Math.round((performance.now()-stepStart)/1000)});
      step=0;lastEval=null;live=null;render()};
    updateMeters();
  } else {
    const last=log.attempts[log.attempts.length-1];
    view.innerHTML=`<h2>4. 결과</h2>
      <div class="msg ${log.result==='DONE'?'ok':'warn'}">${log.result==='DONE'?'블러셔 단계 완료!':'미흡한 상태로 넘어갔어요 (보완 추천 대상)'}</div>
      <p>시도 ${log.attempts.length}회 · 미흡 ${fails}회 · 소요 ${log.durationSec}초</p>
      <p class="small">아래 로그를 복사해서 Claude에게 보내 주세요. 기준값 조정에 씁니다. (얼굴 이미지는 포함되지 않습니다)</p>
      <textarea id="logTxt" readonly>${JSON.stringify(log,null,1)}</textarea>
      <div class="row"><button class="pri" id="btnCopy">로그 복사</button><button id="btnAgain">다시 하기</button></div>`;
    $('btnCopy').onclick=async()=>{try{await navigator.clipboard.writeText($('logTxt').value);$('btnCopy').textContent='복사됨'}catch(e){$('logTxt').select();$('btnCopy').textContent='길게 눌러 복사'}};
    $('btnAgain').onclick=()=>{step=-1;pvStart=performance.now();$('look').value=LOOK_ORDER[0];log.preview={seen:[LOOK_ORDER[0]]};fails=0;lastEval=null;log.attempts=[];delete log.result;render()};
  }
}
function resultHtml(e){
  if(e.pass) return `<div class="msg ok">잘 발렸어요! 다음으로 넘어갈 수 있어요.</div>`;
  return `<div class="msg bad">${e.issues.map(i=>i.t).join('<br>')}</div>`;
}

// ---------- 동작 ----------
let baseBuf=[], baseNo=0;
function captureBaseline(){
  baseBuf=[]; $('btnBase').disabled=true; $('btnBase').textContent='저장 중…';
  const take=()=>{const m=measure(true); if(m) baseBuf.push(m); if(baseBuf.length<6) setTimeout(take,120); else {
    baseline=averageMeasures(baseBuf); baseNo++; step=1; fails=0; lastEval=null; stepStart=performance.now();
    log.strength=$('strength').value; log.look=$('look').value; log.lookHex=LOOKS[$('look').value].hex; log.baseFhL=Math.round(baseBuf[0].fhL); log.ver=VER;
    log.video=`${video.videoWidth}x${video.videoHeight}`; log.baseYaw=r2(baseline.yaw); log.baseFw=r2(baseline.fwRatio);
    say('블러셔 단계입니다. 점선 영역 안에 화살표 방향으로 펴 발라 주세요.'); render();}};
  take();
}
const r1=v=>Math.round(v*10)/10, r2=v=>Math.round(v*100)/100;
// 로그용 상세값: 판정 지점별 붉은 기 증가량(d), 밝기 변화(dL), 얼굴 방향(yaw)
const sideLog=x=>({medDl:Math.round(x.medDl),colDiff:x.colDiff==null?null:Math.round(x.colDiff),shift:x.shift.map(r1),cov:r2(x.cov),int:r1(x.inten),out:r2(x.out),avgD:r1(x.avgD),dL:r1(x.dL),d:x.d.map(v=>Math.round(v)).join(","),od:x.od.map(v=>Math.round(v)).join(","),dl:x.dl.map(v=>Math.round(v)).join(",")});
function judge(){
  const list=[]; let n=0;
  const take=()=>{const m=measure(true); if(m) list.push(m); if(++n<4) setTimeout(take,100); else {
    if(list.length<2){ $('res').innerHTML='<div class="msg warn">얼굴이 잘 안 보여요. 손을 내리고 정면을 본 뒤 다시 눌러 주세요.</div>'; say('얼굴이 잘 안 보여요. 정면을 봐 주세요.'); return; }
    const avg=averageMeasures(list);
    const lightOff=Math.abs(avg.fhL-baseline.fhL)>LIGHT_HOLD.L||Math.hypot(avg.fhA-baseline.fhA,(avg.fhB||0)-(baseline.fhB||0))>LIGHT_HOLD.ab;
    if(lightOff){ log.lightHolds=(log.lightHolds||0)+1; $('res').innerHTML='<div class="msg warn">이마가 가려졌거나 조명이 바뀌었어요. 머리카락·손이 이마를 가리지 않게 하고, 기준 저장 때와 같은 자리에서 다시 눌러 주세요. (판정 보류)</div>'; say('이마가 보이게 하고 다시 눌러 주세요.'); return; }
    if(Math.abs(avg.yaw-baseline.yaw)>YAW_TOL){ // 판정 보류: 고개가 돌아가면 한쪽 볼 조명·각도가 달라짐
      log.holds=(log.holds||0)+1; $('res').innerHTML='<div class="msg warn">고개가 살짝 돌아가 있어요. 정면을 보고 다시 눌러 주세요. (판정 보류, 미흡 횟수에 안 들어가요)</div>'; say('정면을 보고 다시 눌러 주세요.'); return; }
    const e=evaluate(avg);
    const hot=changeMap(avg,e); // 얼굴 전체에서 룩 색 쪽으로 바뀐 곳 (보류여도 계산)
    const glare=[['왼쪽 볼',e.L],['오른쪽 볼',e.R]].filter(([,x])=>Math.abs(x.medDl)>SIDE_GLARE);
    if(glare.length){ // 판정 보류: 한쪽 볼만 빛 반사·측면 조명으로 밝기가 크게 바뀜
      (log.glareHolds=log.glareHolds||[]).push(glare.map(([n,x])=>n+':'+Math.round(x.medDl)).join(','));
      const n=glare.map(([n])=>n).join('·');
      $('res').innerHTML=`<div class="msg warn">${n}에 빛이 반사되거나 조명이 비스듬히 들어와 색을 정확히 볼 수 없어요. 기준 저장 때와 같은 거리·자세로, 조명이 얼굴 정면에 오게 하고 다시 눌러 주세요. (판정 보류)</div>`;
      say('빛 때문에 색을 정확히 볼 수 없어요. 기준 저장 때와 같은 자세로 다시 눌러 주세요.'); return; }
    lastEval=e;
    log.attempts.push({hot, base:baseNo, t:Math.round((performance.now()-stepStart)/1000), pass:e.pass,
      L:sideLog(e.L), R:sideLog(e.R), yaw:r2(avg.yaw), fw:r2(avg.fwRatio), fhL:Math.round(avg.fhL),
      symCov:r2(e.symCov), light:r1(e.light), lightL:r1(e.lightL), issues:e.issues.map(i=>i.k+':'+i.side)});
    if(e.pass){ say('잘 발렸어요. 다음으로 넘어갈까요?'); finishPrompt(); }
    else { fails++; say(e.issues[0].t); render(); }
  }};
  take();
}
function finishPrompt(){ render(); }
function finish(result){
  if(result==='SKIPPED'){ const m=measure(); if(m){ const e=evaluate(m); log.final={L:sideLog(e.L),R:sideLog(e.R),yaw:r2(m.yaw),issues:e.issues.map(i=>i.k+':'+i.side)}; } } // 넘어가기 직전 상태
  log.result=result; log.durationSec=Math.round((performance.now()-stepStart)/1000); step=2; render(); }

// ---------- 루프 ----------
let lastLive=0;
let detMs=0, measMs=0, lastErr='';
function noteErr(where,e){ // 오류가 나도 루프는 계속. 화면 상단·로그에 남김
  const m=`${where}: ${e&&e.message||e}`; lastErr=m; log.errors=log.errors||[];
  if(log.errors.length<8&&!log.errors.includes(m)) log.errors.push(m);
}
function loop(t){
  raf=requestAnimationFrame(loop); // 먼저 다음 프레임 예약 → 아래에서 오류가 나도 멈추지 않음
  if(video.readyState<2) return;
  if(cv.width!==video.videoWidth){cv.width=video.videoWidth;cv.height=video.videoHeight}
  try{ const t0=performance.now(); const res=landmarker.detectForVideo(video,t); detMs=detMs*.8+(performance.now()-t0)*.2;
    lm=res.faceLandmarks&&res.faceLandmarks[0]||null; }catch(e){noteErr('인식',e)}
  try{
    if(step===0) checkPose();
    if(step===-1&&!tone&&lm&&t-toneT>150){ toneT=t; const q=toneSample(), el=$('toneMsg');
      if(q&&Math.abs(q.yaw)<=.1&&q.fhL>=35&&q.fhL<=90){ toneBuf.push(q); if(el){el.className='msg info';el.textContent=`피부 톤 확인 중… ${Math.min(100,Math.round(toneBuf.length/10*100))}%`} if(toneBuf.length>=10) finishTone(); }
      else if(el){ el.className='msg warn'; el.textContent=!q?'얼굴을 찾는 중…':Math.abs(q.yaw)>.1?'정면을 봐 주세요.':'조명이 너무 어둡거나 밝아요. 밝은 곳(창가·정면 조명)으로 이동해 주세요.'; } }
    if(step===1&&baseline&&lm&&t-lastLive>250){lastLive=t; const t1=performance.now(); const m=measure(); if(m){live=evaluate(m); updateMeters();} measMs=performance.now()-t1;}
  }catch(e){noteErr('측정',e)}
  try{ draw(t); }catch(e){noteErr('그리기',e)}
  frames++; if(t-fpsT>1000){
    $('fps').textContent=`${frames} fps · 인식 ${Math.round(detMs)}ms · 측정 ${Math.round(measMs)}ms`+(lm?'':' · 얼굴 없음')+(lastErr?' · ⚠ '+lastErr.slice(0,40):'');
    if(step===1){log.perf=log.perf||{}; log.perf.fps=frames; log.perf.detMs=Math.round(detMs); log.perf.measMs=Math.round(measMs);}
    frames=0;fpsT=t}
}
function updateMeters(){
  if(step!==1||!$('mLb')) return;
  const e=live, set=(id,v,txt)=>{$(id+'b').style.width=Math.max(0,Math.min(100,v*100))+'%';$(id+'n').textContent=txt};
  if(e){ set('mL',e.L.cov,Math.round(e.L.cov*100)+'%'); set('mR',e.R.cov,Math.round(e.R.cov*100)+'%');
    set('mS',e.symCov,Math.round(e.symCov*100)+'%'); const o=Math.max(e.L.out,e.R.out); set('mO',o,Math.round(o*100)+'%');
    const cd=[e.L.colDiff,e.R.colDiff].filter(v=>v!=null); if(cd.length){const w=Math.max(...cd.map(Math.abs)); set('mC',Math.max(0,1-w/90),Math.round(Math.max(0,1-w/90)*100)+'%')} else set('mC',0,'–'); }
  const sec=Math.round((performance.now()-stepStart)/1000);
  const glr=e&&[['왼쪽 볼',e.L],['오른쪽 볼',e.R]].filter(([,x])=>Math.abs(x.medDl)>SIDE_GLARE).map(([n])=>n);
  const turned=e&&Math.abs(e.yawDiff)>YAW_TOL, lit=e&&(Math.abs(e.lightL)>LIGHT_HOLD.L||Math.hypot(e.light,e.lightB||0)>LIGHT_HOLD.ab);
  $('st').innerHTML=(glr&&glr.length?`<b style="color:#b3261e">${glr.join('·')}에 빛 반사·측면 조명이 있어요</b><br>`:'')+(lit?'<b style="color:#b3261e">이마가 가려졌거나 조명이 바뀌었어요</b><br>':'')+(turned?'<b style="color:#b3261e">고개가 돌아갔어요 · 기준 저장 때처럼 정면을 봐 주세요</b><br>':'')+`세로선 = 기준값 · 판정 강도 ${$('strength').selectedOptions[0].text} · 미흡 ${fails}회 · ${sec}초`;
  $('btnSkip').hidden=!(fails>=3||sec>=60);
}
let poseT=0;
function checkPose(){
  const el=$('chk'), btn=$('btnBase'); if(!el) return;
  const now=performance.now(); if(now-poseT<300) return; poseT=now;
  if(!lm){el.className='msg warn';el.textContent='얼굴이 안 보여요. 화면 가운데에 얼굴을 맞춰 주세요.';btn.disabled=true;return}
  const m=measure(); const fr=m.fwRatio;
  let msg='', cls='ok';
  if(fr<.30){msg='조금 더 가까이 와 주세요.';cls='warn'} else if(fr>.75){msg='조금 더 멀리 떨어져 주세요.';cls='warn'}
  else if(Math.abs(m.yaw)>.1){msg='얼굴이 살짝 옆을 보고 있어요. 휴대폰을 얼굴 정면 가운데에 두고 똑바로 봐 주세요.';cls='warn'}
  else if(m.fhL<35){msg='너무 어두워요. 밝은 곳(창가·정면 조명)으로 이동해 주세요.';cls='warn'}
  else if(m.fhL>88){msg='빛이 너무 강해요. 정면 직사광을 피해 주세요.';cls='warn'}
  else msg='좋아요! 기준 저장을 눌러 주세요.';
  el.className='msg '+cls; el.textContent=msg; btn.disabled=cls!=='ok';
}

// ---------- 시작 ----------
// 단계마다 시간 제한: 멈추면 어느 단계에서 멈췄는지 화면에 표시
const withTimeout=(p,ms,stage)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(`${stage} 단계가 ${ms/1000}초 안에 끝나지 않았어요`)),ms))]);
const VER='v18 · 11-22';
// 영상 크기가 잡힐 때까지 100ms마다 확인 (iOS는 이벤트가 안 오는 경우가 있어 폴링)
const waitVideo=ms=>new Promise(res=>{const t0=performance.now();const tick=()=>{if(video.videoWidth>0) return res(true); if(performance.now()-t0>ms) return res(false); setTimeout(tick,100)};tick();});
let ticker=0; const progress=(n,text)=>{const msg=$('loadMsg'),t0=performance.now();clearInterval(ticker);const f=()=>msg.textContent=`[${n}/3] ${text} · ${Math.round((performance.now()-t0)/1000)}초 (${VER})`;f();ticker=setInterval(f,1000);};
$('btnStart').onclick=async()=>{
  const msg=$('loadMsg'); $('btnStart').disabled=true;
  if('speechSynthesis' in window&&$('tts').checked){try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}} // iOS: 버튼 누를 때 음성 잠금 해제
  let stage='카메라 권한';
  try{
    // 1) 카메라를 먼저 연다 (iOS는 버튼을 누른 직후에 요청해야 안정적)
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('이 브라우저는 카메라를 지원하지 않아요. 사파리로 열어 주세요');
    progress(1,'카메라 권한 요청 중… 팝업이 뜨면 허용을 눌러 주세요');
    const stream=await withTimeout(navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false}),20000,stage);
    stage='카메라 화면 재생'; progress(2,'카메라 화면을 켜는 중…');
    video.srcObject=stream;
    video.play().catch(()=>{}); // iOS에서 play()가 끝나지 않는 경우가 있어 기다리지 않음
    let ok=await waitVideo(3000);
    if(!ok){ // 자동 재생이 막힌 경우: 화면을 한 번 누르면 재생
      progress(2,'카메라 화면이 안 켜졌어요. 화면 아무 곳이나 한 번 눌러 주세요');
      const tap=()=>video.play().catch(()=>{}); document.addEventListener('click',tap); document.addEventListener('touchend',tap);
      ok=await waitVideo(20000); document.removeEventListener('click',tap); document.removeEventListener('touchend',tap);
      if(!ok) throw new Error(`카메라 영상이 들어오지 않아요 (readyState=${video.readyState}, paused=${video.paused}, 트랙=${stream.getVideoTracks().map(t=>t.readyState).join(',')})`);
    }
    // 2) 얼굴 인식 모델
    stage='얼굴 인식 모델 불러오기'; progress(3,'얼굴 인식 모델을 불러오는 중… (처음 1회 수 초~수십 초)');
    const files=await withTimeout(FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm"),60000,stage);
    const opts=d=>({baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:d},runningMode:"VIDEO",numFaces:1});
    try{landmarker=await withTimeout(FaceLandmarker.createFromOptions(files,opts("GPU")),60000,stage+'(GPU)')}
    catch(e){progress(3,'GPU 모드 실패 → CPU 모드로 다시 시도 중…'); log.gpuError=String(e&&e.message||e); landmarker=await withTimeout(FaceLandmarker.createFromOptions(files,opts("CPU")),60000,stage+'(CPU)')}
    log.delegate=log.gpuError?'CPU':'GPU';
    clearInterval(ticker); $('start').hidden=true; $('panel').hidden=false;
    step=-1; pvStart=performance.now(); log.preview={seen:[$('look').value]};
    say('완성 모습을 먼저 보여 드릴게요.'); render(); raf=requestAnimationFrame(loop);
  }catch(e){
    clearInterval(ticker); $('btnStart').disabled=false;
    msg.textContent=(e&&e.name==='NotAllowedError')?'카메라 권한이 거부됐어요. 설정 → Safari → 카메라 → 허용 후 새로고침해 주세요.':`시작하지 못했어요 [${stage}]: `+(e&&(e.name?e.name+' ':'')+(e.message||e));
  }
};
</script>
